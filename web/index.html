<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI Resume Analyzer">
  <meta name="description" content="AI Resume Analyzer">
  <meta
  name="google-signin-client_id"
  content="714792558226-3psg4f1obo97f2l9jn652mac6uajpesg.apps.googleusercontent.com">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AI Resume Analyzer</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Razorpay Checkout.js — loaded SYNCHRONOUSLY (no defer/async)
    so it is 100% ready before Flutter calls registerRazorpayCallbacks
  -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // Razorpay Web Payment Bridge
    //
    // WHY: dart:js cannot pass Dart functions inside JsObject.jsify() maps.
    // SOLUTION: Two separate calls from Dart —
    //   1. registerRazorpayCallbacks(onSuccess, onDismiss) — Dart callbacks
    //   2. openRazorpayCheckout(key, orderId, ...) — scalar values only
    // This file builds the full Razorpay options object in pure JS.
    // ─────────────────────────────────────────────────────────────────────────

    var _rzpOnSuccess = null;
    var _rzpOnDismiss = null;

    window.registerRazorpayCallbacks = function(onSuccess, onDismiss) {
      _rzpOnSuccess = onSuccess;
      _rzpOnDismiss = onDismiss;
      console.log('[Razorpay Bridge] Callbacks registered ✅');
    };

    window.openRazorpayCheckout = function(keyId, orderId, amount, currency, name, description, userEmail, userName) {
      console.log('[Razorpay Bridge] openRazorpayCheckout called');
      console.log('  key:', keyId, '| order:', orderId, '| amount:', amount, currency);

      if (typeof Razorpay === 'undefined') {
        console.error('[Razorpay Bridge] ❌ Checkout.js NOT loaded!');
        if (_rzpOnDismiss) _rzpOnDismiss();
        return;
      }

      if (!_rzpOnSuccess || !_rzpOnDismiss) {
        console.error('[Razorpay Bridge] ❌ Callbacks not registered!');
        return;
      }

      var options = {
        key:         keyId,
        amount:      amount,
        currency:    currency,
        order_id:    orderId,
        name:        name        || 'Resume AI',
        description: description || 'Premium Feature',
        prefill: {
          name:    userName  || '',
          email:   userEmail || '',
          contact: ''
        },
        theme: { color: '#2D5BE3' },

        handler: function(response) {
          console.log('[Razorpay Bridge] ✅ Payment success:', response.razorpay_payment_id);
          var cb = _rzpOnSuccess;
          _rzpOnSuccess = null;
          _rzpOnDismiss = null;
          if (cb) cb(
            response.razorpay_payment_id  || '',
            response.razorpay_order_id    || '',
            response.razorpay_signature   || ''
          );
        },

        modal: {
          ondismiss: function() {
            console.log('[Razorpay Bridge] Modal dismissed');
            var cb = _rzpOnDismiss;
            _rzpOnSuccess = null;
            _rzpOnDismiss = null;
            if (cb) cb();
          }
        }
      };

      try {
        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function(response) {
          console.error('[Razorpay Bridge] Payment failed:', response.error.description);
          var cb = _rzpOnDismiss;
          _rzpOnSuccess = null;
          _rzpOnDismiss = null;
          if (cb) cb();
        });

        rzp.open();
        console.log('[Razorpay Bridge] ✅ Modal opened');
      } catch(e) {
        console.error('[Razorpay Bridge] ❌ Error opening modal:', e);
        var cb = _rzpOnDismiss;
        _rzpOnSuccess = null;
        _rzpOnDismiss = null;
        if (cb) cb();
      }
    };

    console.log('[Razorpay Bridge] Script ready ✅');
  </script>
</head>

<body>
  <!--
    Flutter Web Bootstrap
    flutter_bootstrap.js is auto-generated by Flutter during build/run.
    NO async/defer here — Flutter must init after Razorpay is ready.
  -->
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
