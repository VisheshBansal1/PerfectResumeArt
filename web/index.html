       Real security headers (Content-Security-Policy, X-Frame-Options,

       response headers, not meta tags — browsers ignore most of them
       when set via <meta>, and a wrong CSP here (blocking Razorpay,
       AdSense, or Firebase auth) would break the app with no easy way to
       roll it back without rebuilding. Set these at your host instead:
         • Netlify:    a `_headers` file at the site root

  <!-- ═══════════════════════════════════════════════════════════════════
       RAZORPAY WEB PAYMENT BRIDGE — EXISTING CODE, PRESERVED EXACTLY
       Loaded SYNCHRONOUSLY (no defer/async) so it is 100% ready before
       Flutter calls registerRazorpayCallbacks. Do not add async/defer.
  ═══════════════════════════════════════════════════════════════════ -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // Razorpay Web Payment Bridge
    //
    // WHY: dart:js cannot pass Dart functions inside JsObject.jsify() maps.
    // SOLUTION: Two separate calls from Dart —
    //   1. registerRazorpayCallbacks(onSuccess, onDismiss) — Dart callbacks
    //   2. openRazorpayCheckout(key, orderId, ...) — scalar values only
    // This file builds the full Razorpay options object in pure JS.
    // ─────────────────────────────────────────────────────────────────────────

    var _rzpOnSuccess = null;
    var _rzpOnDismiss = null;

    window.registerRazorpayCallbacks = function(onSuccess, onDismiss) {
      _rzpOnSuccess = onSuccess;
      _rzpOnDismiss = onDismiss;
      console.log('[Razorpay Bridge] Callbacks registered ✅');
    };

    window.openRazorpayCheckout = function(keyId, orderId, amount, currency, name, description, userEmail, userName) {
      console.log('[Razorpay Bridge] openRazorpayCheckout called');
      console.log('  key:', keyId, '| order:', orderId, '| amount:', amount, currency);

      if (typeof Razorpay === 'undefined') {
        console.error('[Razorpay Bridge] ❌ Checkout.js NOT loaded!');
        if (_rzpOnDismiss) _rzpOnDismiss();
        return;
      }

      if (!_rzpOnSuccess || !_rzpOnDismiss) {
        console.error('[Razorpay Bridge] ❌ Callbacks not registered!');
        return;
      }

      var options = {
        key:         keyId,
        amount:      amount,
        currency:    currency,
        order_id:    orderId,
        name:        name        || 'Resume AI',
        description: description || 'Premium Feature',
        prefill: {
          name:    userName  || '',
          email:   userEmail || '',
          contact: ''
        },
        theme: { color: '#2D5BE3' },

        handler: function(response) {
          console.log('[Razorpay Bridge] ✅ Payment success:', response.razorpay_payment_id);
          var cb = _rzpOnSuccess;
          _rzpOnSuccess = null;
          _rzpOnDismiss = null;
          if (cb) cb(
            response.razorpay_payment_id  || '',
            response.razorpay_order_id    || '',
            response.razorpay_signature   || ''
          );
        },

        modal: {
          ondismiss: function() {
            console.log('[Razorpay Bridge] Modal dismissed');
            var cb = _rzpOnDismiss;
            _rzpOnSuccess = null;
            _rzpOnDismiss = null;
            if (cb) cb();
          }
        }
      };

      try {
        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function(response) {
          console.error('[Razorpay Bridge] Payment failed:', response.error.description);
          var cb = _rzpOnDismiss;
          _rzpOnSuccess = null;
          _rzpOnDismiss = null;
          if (cb) cb();
        });

        rzp.open();
        console.log('[Razorpay Bridge] ✅ Modal opened');
      } catch(e) {
        console.error('[Razorpay Bridge] ❌ Error opening modal:', e);
        var cb = _rzpOnDismiss;
        _rzpOnSuccess = null;
        _rzpOnDismiss = null;
        if (cb) cb();
      }
    };

    console.log('[Razorpay Bridge] Script ready ✅');
  </script>

       JS the moment Flutter actually paints. */
    #seo-prerender-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;

      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  <script>
    (function () {
      var seoBlock = document.getElementById('seo-prerender-content');
      if (!seoBlock) return;
      function hideSeoBlock() { seoBlock.style.display = 'none'; }
      // Primary: Flutter's own first-frame signal.
      window.addEventListener('flutter-first-frame', hideSeoBlock);
      // Fallback: hide as soon as Flutter's canvas/glass-pane appears, in
      // case this build doesn't dispatch flutter-first-frame.
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view, canvas')) {
          hideSeoBlock();
          observer.disconnect();
        }
      });
